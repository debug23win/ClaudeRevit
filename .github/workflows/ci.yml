name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore ClaudeRevit\ClaudeRevit.csproj
      - name: Build (Release, no deploy)
        run: dotnet build ClaudeRevit\ClaudeRevit.csproj -c Release -p:SkipDeploy=true --no-restore
      - name: Compile native acceptance harness (does not run without Revit)
        run: dotnet build ClaudeRevit.NativeTests\ClaudeRevit.NativeTests.csproj -c Release -p:SkipDeploy=true
      - name: Unit tests (pure logic, no Revit)
        run: dotnet test ClaudeRevit.Tests\ClaudeRevit.Tests.csproj -c Release
      - name: Pane checks (isolated WPF, no Revit or account)
        run: dotnet run --project ClaudeRevit.PaneTests -c Release -- pane-qa
      - name: MCP transport checks (isolated HTTP and stdio clients)
        run: dotnet run --project ClaudeRevit.McpTests -c Release
      - name: Subscription CLI checks (isolated fake processes, no account)
        run: dotnet run --project ClaudeRevit.CliTests -c Release
      - name: Compile installer detection check
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer\checks\DetectionCheck.iss
          options: /Qp
      - name: Installer detection regression checks
        shell: pwsh
        run: ./installer/checks/Test-Detection.ps1
      - name: Upload Revit 2027 build
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeRevit-Revit2027
          path: |
            ClaudeRevit/bin/Release/release/**
            scripts/revit-mcp-bridge.ps1
          if-no-files-found: error
          retention-days: 14
