name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ClaudeRevit\ClaudeRevit.csproj
      - name: Build (Release, no deploy)
        run: dotnet build ClaudeRevit\ClaudeRevit.csproj -c Release -p:SkipDeploy=true --no-restore
      - name: Unit tests (pure logic, no Revit)
        run: dotnet test ClaudeRevit.Tests\ClaudeRevit.Tests.csproj -c Release
      - name: Upload Revit 2027 build
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeRevit-Revit2027
          path: |
            ClaudeRevit/bin/Release/release/**
            scripts/revit-mcp-bridge.ps1
          if-no-files-found: error
          retention-days: 14
